# config.yaml
# Centralized analytical parameters for the CampusGather pipeline.

# Uses relative paths to ensure reproducibility across different operating systems.
paths:
  # Source of the raw Copenhagen Networks Study archive
  raw_data_dir: "data/raw/7267433/"
  # Output destination for the frozen data schemas
  processed_data_dir: "data/processed/"

# Discretizes continuous time into standardized bins.
time_parameters:
  # Locked to the dataset's physical 5-minute Bluetooth scanning interval
  slot_duration_sec: 300
  # Exponential decay factor to prioritize recent telecom communication 
  time_decay_constant: 3600

# Controls the strictness of physical proximity connections.
bluetooth_parameters:
  # Array of dBm limits (-80 is close, -90 is hallway) for automated sensitivity analysis
  rssi_thresholds: [-80, -85, -90]

# Defines the baseline for a valid social gathering.
clustering_parameters:
  # Minimum participants required to filter out random two-person passing noise
  min_gathering_size: 3