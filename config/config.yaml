# Centralized analytical parameters for the CampusGather pipeline.

paths:
  raw_data_dir: "data/raw/7267433/"
  processed_data_dir: "data/processed/"

time_parameters:
  slot_duration_sec: 300
  time_decay_constant: 3600

bluetooth_parameters:
  # Active threshold used by every pipeline run.
  # -80 is close contact, -90 also admits corridor / through-wall contacts.
  rssi_threshold: -90
  # Candidate values for the threshold sensitivity analysis.
  rssi_thresholds: [-80, -85, -90]

clustering_parameters:
  min_gathering_size: 3

episode_parameters:
  # Rows of gatherings_v1 are linked into episodes: Jaccard >= threshold, at most
  # max_gap_slots unseen slots in between. Chosen in notebooks/episodes_theta_gap.ipynb.
  jaccard_threshold: 0.7
  max_gap_slots: 1

feature_parameters:
  # Communication between episode members before the episode starts.
  communication_lookback_hours: 24
  
# Configuration for the archetype-clustering experiment.
archetype_clustering_parameters:
  random_seed: 42
  k_values: [2, 3, 4, 5, 6, 7, 8]
  n_init: 20
  silhouette_sample_size: 3000

  # Independent partitions, not levels of a hierarchy.
  coarse_k: 2
  descriptive_k: 5

# Seeds used for initialization-stability comparisons.
cluster_stability_parameters:
  seeds: [1, 2, 3, 4, 5]